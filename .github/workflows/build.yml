name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # No push here -- this job only proves the multi-arch image builds
      # (M1's acceptance bar: CI builds both amd64+aarch64; real install and
      # runtime verification happens on amd64 only, no aarch64 hardware
      # available yet). Publishing a real image tag is a later concern.
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@v6
        with:
          context: dashboard_studio
          platforms: linux/amd64,linux/arm64
          push: false
