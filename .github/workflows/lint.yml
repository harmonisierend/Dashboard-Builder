name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard_studio/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard_studio/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard_studio/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  config-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate config.yaml is well-formed YAML
        run: python3 -c "import yaml; yaml.safe_load(open('dashboard_studio/config.yaml'))"
